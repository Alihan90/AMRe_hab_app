name: Flutter Build APK (Build Workflow)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Reconstruct Android Project Platform
        run: |
          flutter create --platforms=android --project-name=amre_hab_app .
          flutter pub get

      - name: Force Global Android SDK 34 via Gradle Properties
        run: |
          mkdir -p android
          # Прописуємо глобальні змінні для Gradle, які перевизначать налаштування всіх плагінів (зокрема share_plus)
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=23" >> android/local.properties

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons
