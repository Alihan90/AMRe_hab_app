name: Flutter Build APK (Build Workflow)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Reconstruct Android Project Platform
        run: |
          flutter create --platforms=android --project-name=amre_hab_app .
          flutter pub get

      - name: Force Android SDK 34 Core Config
        run: |
          if [ -f android/app/build.gradle ]; then
            # Замінюємо будь-які згадки версій компіляції на 34
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/compileSdk .*/compileSdk 34/g' android/app/build.gradle || true
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/targetSdk .*/targetSdk 34/g' android/app/build.gradle || true
            
            # Додатково коригуємо файл налаштувань самого Gradle, якщо він створений через змінні
            sed -i 's/flutter.compileSdkVersion.*/34/g' android/local.properties || true
            sed -i 's/flutter.targetSdkVersion.*/34/g' android/local.properties || true
          fi

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons
