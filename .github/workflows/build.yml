name: Build Mobile Apps
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4 # Оновлено до v4

      - name: Set up Java
        uses: actions/setup-java@v4 # Оновлено до v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # Автоматично створюємо папки android та ios, яких немає на GitHub
      - name: Create Platform Folders
        run: flutter create .

      - name: Install Dependencies
        run: flutter pub get

      # Збірка для Android (на виході отримаєш готовий APK)
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      # Збірка для iOS
      - name: Build iOS
        run: flutter build ios --no-codesign

      # Завантаження готових файлів (Виправлено на актуальну v4)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rehab-App-Builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/ios/iphoneos/*.app
