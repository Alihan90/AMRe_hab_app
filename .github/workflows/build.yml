name: Flutter Build APK (Build Workflow)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x' # автоматично підхопить актуальну стабільну версію
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Auto-fix Android SDK Version to 34
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/compileSdk .*/compileSdk 34/g' android/app/build.gradle || true
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/targetSdk .*/targetSdk 34/g' android/app/build.gradle || true
            echo "Android SDK successfully upgraded to 34 in build.gradle"
          else
            echo "Custom Android build.gradle not found, skipping inline fix."
          fi

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons
