name: Build Flutter Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Auto-repair Android target SDK and Duplicate Classes
        run: |
          # Створюємо платформу з правильною назвою проекту маленькими літерами, якщо папки немає
          if [ ! -d "android" ]; then
            echo "Папку android не знайдено. Створюємо шаблон..."
            flutter create . --platforms=android --project-name=amre_hab_app
          fi
          
          # Примусово міняємо версію SDK на 34 у всіх конфігураціях Gradle
          find android/ -name "build.gradle" -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' {} +
          find android/ -name "build.gradle" -exec sed -i 's/targetSdkVersion 33/targetSdkVersion 34/g' {} +
          find android/ -name "build.gradle" -exec sed -i 's/compileSdk 33/compileSdk 34/g' {} +
          find android/ -name "build.gradle" -exec sed -i 's/targetSdk 33/targetSdk 34/g' {} +

          # ВИПРАВЛЕННЯ ДУБЛІКАТІВ КЛАСІВ KOTLIN:
          # Прописуємо примусове вирівнювання залежностей у конфігурацію gradle додатка
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            echo "Впроваджуємо виправлення дублікатів Kotlin у $GRADLE_FILE..."
            echo "
            configurations.all {
                resolutionStrategy {
                    eachDependency { details ->
                        if (details.requested.group == 'org.jetbrains.kotlin') {
                            details.useVersion '1.8.10'
                        }
                    }
                }
            }" >> $GRADLE_FILE
          fi

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vit-rehab-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
